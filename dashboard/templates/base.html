<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warren Buffett Bot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo">
      <h2>📈 Warren Buffett Bot</h2>
      <p>자동매매 대시보드</p>
    </div>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">포지션</a>
    <a href="/trades" class="{{ 'active' if request.url.path == '/trades' else '' }}">거래내역</a>
    <a href="/backtest" class="{{ 'active' if request.url.path == '/backtest' else '' }}">백테스트</a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">설정</a>
  </nav>
  <main class="content">
    {% for a in agent_alerts() %}
    <div class="alert alert-error">
      <div class="alert-title">
        에이전트 판단 실패 - {{ a.label }}
        <span class="alert-meta">
          최근 24시간 {{ a.n }}건{% if a.ts %} · 마지막 {{ a.ts.strftime("%m/%d %H:%M") }}{% endif %}
        </span>
      </div>
      {% if a.detail %}<div class="alert-detail">{{ a.detail }}</div>{% endif %}
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
