<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warren Buffett Bot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo">
      <h2>📈 Warren Buffett Bot</h2>
      <p>자동매매 대시보드</p>
    </div>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">포지션</a>
    <a href="/trades" class="{{ 'active' if request.url.path == '/trades' else '' }}">거래내역</a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">설정</a>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
